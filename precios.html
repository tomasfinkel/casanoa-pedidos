<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Consultá tu precio · Casa NOA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #2c1a0e;
      padding: 1.25rem 1.5rem;
      text-align: center;
    }

    header h1 {
      color: #e8d5b0;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    header p {
      color: #a08060;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem 1.25rem;
      flex: 1;
    }

    /* Botón escanear */
    #btn-escanear {
      width: 100%;
      background: #2c1a0e;
      color: #e8d5b0;
      border: none;
      border-radius: 14px;
      padding: 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: opacity 0.15s;
      margin-bottom: 1rem;
    }

    #btn-escanear:active { opacity: 0.8; }

    #btn-escanear svg { width: 24px; height: 24px; }

    /* Área de cámara */
    #camara-container {
      display: none;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 1rem;
      aspect-ratio: 4/3;
    }

    #camara-container.activa { display: block; }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visor {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .visor-marco {
      width: 70%;
      height: 35%;
      border: 2.5px solid rgba(232, 213, 176, 0.9);
      border-radius: 8px;
      box-shadow: 0 0 0 1000px rgba(0,0,0,0.35);
    }

    .visor-texto {
      position: absolute;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
    }

    #btn-cerrar-camara {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Separador */
    .separador {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: #a08060;
      font-size: 0.85rem;
    }

    .separador::before,
    .separador::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #d4c4a8;
    }

    /* Buscador por nombre */
    #campo-busqueda {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #d4c4a8;
      border-radius: 12px;
      font-size: 1rem;
      background: white;
      color: #2c1a0e;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.25rem;
    }

    #campo-busqueda:focus { border-color: #2c1a0e; }
    #campo-busqueda::placeholder { color: #b0956f; }

    /* Estado */
    #estado {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.9rem;
      color: #7a6048;
      display: none;
    }

    /* Resultado */
    #resultado {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 16px rgba(44, 26, 14, 0.1);
    }

    #resultado .precio {
      font-size: 2.6rem;
      font-weight: 700;
      color: #2c1a0e;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    #resultado .nombre {
      font-size: 1rem;
      color: #5a3e28;
      line-height: 1.4;
      margin-bottom: 0.75rem;
    }

    #resultado .codigo {
      font-size: 0.8rem;
      color: #b0956f;
    }

    /* Lista de resultados múltiples */
    #lista-resultados {
      display: none;
    }

    .item-resultado {
      background: white;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 8px rgba(44, 26, 14, 0.08);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .item-resultado:active { transform: scale(0.98); }

    .item-nombre {
      font-size: 0.9rem;
      color: #2c1a0e;
      flex: 1;
      margin-right: 1rem;
      line-height: 1.3;
    }

    .item-precio {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2c1a0e;
      white-space: nowrap;
    }

    /* Sin resultado */
    #sin-resultado {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      color: #7a6048;
    }

    #sin-resultado .icono { font-size: 2.5rem; margin-bottom: 0.5rem; }
    #sin-resultado p { font-size: 0.95rem; }
  </style>
</head>
<body>

<header>
  <h1>Casa NOA</h1>
  <p>Consultá el precio de cualquier producto</p>
</header>

<main>

  <button id="btn-escanear" onclick="iniciarEscaneo()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    Escanear código de barras
  </button>

  <div id="camara-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="visor">
      <div class="visor-marco"></div>
      <p class="visor-texto">Apuntá al código de barras del producto</p>
    </div>
    <button id="btn-cerrar-camara" onclick="cerrarCamara()" aria-label="Cerrar cámara">✕</button>
  </div>

  <div class="separador">o buscá por nombre</div>

  <input
    id="campo-busqueda"
    type="text"
    placeholder="Ej: chocolate, yerba, aceite..."
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    oninput="buscarPorNombre(this.value)"
  >

  <div id="estado"></div>

  <div id="resultado">
    <div class="precio" id="res-precio"></div>
    <div class="nombre" id="res-nombre"></div>
    <div class="codigo" id="res-codigo"></div>
  </div>

  <div id="lista-resultados"></div>

  <div id="sin-resultado">
    <div class="icono">🔍</div>
    <p>No se encontró el producto.<br>Consultá en caja.</p>
  </div>

</main>

<!-- ZXing para escaneo de códigos de barra -->
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

<script>
  let codeReader = null;
  let streamActivo = null;
  let busquedaTimeout = null;

  // ─── Escaneo de código de barras ───────────────────────────────

  async function iniciarEscaneo() {
    const container = document.getElementById('camara-container');
    const video = document.getElementById('video');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });

      streamActivo = stream;
      video.srcObject = stream;
      container.classList.add('activa');

      codeReader = new ZXing.BrowserMultiFormatReader();

      codeReader.decodeFromVideoElement(video, (result, err) => {
        if (result) {
          const barcode = result.getText();
          cerrarCamara();
          buscarPorBarcode(barcode);
        }
      });

    } catch (err) {
      mostrarEstado('No se pudo acceder a la cámara. Usá la búsqueda por nombre.');
    }
  }

  function cerrarCamara() {
    const container = document.getElementById('camara-container');
    container.classList.remove('activa');

    if (codeReader) {
      codeReader.reset();
      codeReader = null;
    }

    if (streamActivo) {
      streamActivo.getTracks().forEach(t => t.stop());
      streamActivo = null;
    }
  }

  // ─── Búsqueda ───────────────────────────────────────────────────

  async function buscarPorBarcode(barcode) {
    limpiarResultados();
    mostrarEstado('Buscando...');

    try {
      const res = await fetch(`/api/buscar-producto?q=${encodeURIComponent(barcode)}`);
      const data = await res.json();
      mostrarResultados(data.resultados, barcode);
    } catch {
      mostrarEstado('Error de conexión. Intentá de nuevo.');
    }
  }

  function buscarPorNombre(texto) {
    clearTimeout(busquedaTimeout);
    limpiarResultados();

    if (texto.trim().length < 2) return;

    busquedaTimeout = setTimeout(async () => {
      mostrarEstado('Buscando...');
      try {
        const res = await fetch(`/api/buscar-producto?q=${encodeURIComponent(texto.trim())}`);
        const data = await res.json();
        mostrarResultados(data.resultados, texto);
      } catch {
        mostrarEstado('Error de conexión. Intentá de nuevo.');
      }
    }, 400);
  }

  // ─── Mostrar resultados ─────────────────────────────────────────

  function mostrarResultados(resultados, busqueda) {
    ocultarEstado();

    if (!resultados || resultados.length === 0) {
      document.getElementById('sin-resultado').style.display = 'block';
      return;
    }

    if (resultados.length === 1) {
      mostrarProducto(resultados[0]);
      return;
    }

    // Múltiples resultados → lista
    const lista = document.getElementById('lista-resultados');
    lista.innerHTML = '';
    lista.style.display = 'block';

    resultados.forEach(p => {
      const div = document.createElement('div');
      div.className = 'item-resultado';
      div.innerHTML = `
        <div class="item-nombre">${p.nombre}</div>
        <div class="item-precio">${formatearPrecio(p.precio)}</div>
      `;
      div.onclick = () => {
        lista.style.display = 'none';
        mostrarProducto(p);
      };
      lista.appendChild(div);
    });
  }

  function mostrarProducto(p) {
    const resultado = document.getElementById('resultado');
    document.getElementById('res-precio').textContent = formatearPrecio(p.precio);
    document.getElementById('res-nombre').textContent = p.nombre;
    document.getElementById('res-codigo').textContent = p.barcode ? `Cód. barra: ${p.barcode}` : `Cód.: ${p.codigo}`;
    resultado.style.display = 'block';
  }

  function formatearPrecio(precio) {
    const num = parseFloat(precio) || 0;
    return num.toLocaleString('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function mostrarEstado(msg) {
    const el = document.getElementById('estado');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function ocultarEstado() {
    document.getElementById('estado').style.display = 'none';
  }

  function limpiarResultados() {
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('lista-resultados').style.display = 'none';
    document.getElementById('sin-resultado').style.display = 'none';
    ocultarEstado();
  }
</script>

</body>
</html>
