<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa NOA - Devoluciones</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f5f0e8;min-height:100vh;padding:12px}
.wrap{max-width:1100px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px;background:#1a1410;border-radius:12px;padding:14px 18px}
.titulo{font-size:18px;font-weight:bold;color:#f5f0e8;letter-spacing:1px}
.subtitulo{font-size:11px;color:#c9a252;margin-top:2px}
.sync{font-size:11px;margin-top:4px}
.sync.ok{color:#4caf50}.sync.err{color:#f44336}.sync.loading{color:#c9a252}
.xbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:12px;color:#666;margin-bottom:4px;display:block;font-weight:bold}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:8px 11px;font-size:13px;color:#222;background:#fff;font-family:Arial,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:#B85C38}
textarea{resize:vertical;min-height:50px}
.btn-add{width:100%;padding:12px;background:#B85C38;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:6px}
.btn-add:disabled{background:#ccc;cursor:not-allowed}
.btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:bold}
.btn-csv{background:#185FA5;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-sec{background:#f0f0f0;color:#333;border:1px solid #ccc}
.filtros{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:7px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#555;font-size:12px;cursor:pointer;font-weight:bold}
.fbtn.on{background:#B85C38;border-color:#B85C38;color:#fff}
.twrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid #ddd}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f5f5f5;padding:8px 10px;text-align:left;font-size:11px;color:#666;border-bottom:1px solid #eee;font-weight:bold;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f0f0f0;color:#222;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f5}
.suc-mig{background:#EAF3DE;color:#27500A;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.suc-sir{background:#E6F1FB;color:#185FA5;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.suc-cas{background:#FAECE7;color:#993C1D;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.bd{background:#FAECE7;color:#993C1D;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.bf{background:#E6F1FB;color:#185FA5;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.bo{background:#f0f0f0;color:#555;padding:3px 8px;border-radius:6px;font-size:11px}
.chk{width:17px;height:17px;cursor:pointer;accent-color:#B85C38}
.done td{opacity:.4;text-decoration:line-through}
.done td:last-child,.done td:nth-last-child(2){text-decoration:none;opacity:1}
.empty{text-align:center;padding:32px;color:#888;font-size:14px}
.bdel{background:none;border:none;color:#ccc;cursor:pointer;padding:3px 7px;border-radius:4px;font-size:14px}
.bdel:hover{color:#c00;background:#fee}
.bwarow{background:#25D366;border:none;border-radius:6px;padding:5px 9px;color:#fff;cursor:pointer;font-size:11px;font-weight:bold}
.panel{display:none;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:10px}
.panel.open{display:block}
.panel-title{font-size:14px;font-weight:bold;margin-bottom:10px;color:#1a1410}
.prev{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;max-height:200px;overflow-y:auto;font-family:monospace;color:#555;margin-bottom:10px}
.warow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foto-lbl{display:inline-block;padding:7px 14px;background:#f5f0e8;border:1px dashed #B85C38;border-radius:8px;cursor:pointer;font-size:12px;color:#B85C38;font-weight:bold}
.fp{width:36px;height:36px;object-fit:cover;border-radius:6px;border:2px solid #B85C38;cursor:pointer}
.contador{font-size:12px;color:#B85C38;font-weight:bold;margin-bottom:8px}
.err-box{background:#fee;border:1px solid #f44336;border-radius:8px;padding:10px 14px;font-size:12px;color:#c00;margin-bottom:10px;display:none}
.foto-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.foto-modal.open{display:flex}
.foto-modal img{max-width:95%;max-height:80vh;border-radius:8px;object-fit:contain}
.foto-modal-close{color:#fff;font-size:15px;margin-top:16px;background:#B85C38;border:none;border-radius:8px;padding:10px 28px;cursor:pointer;font-weight:bold}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="foto-modal" id="fotoModal">
  <img id="fotoModalImg" src="" alt="foto" />
  <button class="foto-modal-close" id="fotoModalClose">Cerrar</button>
</div>

<div class="wrap">
  <div class="hdr">
    <div>
      <div class="titulo">CASA NOA</div>
      <div class="subtitulo">Devoluciones y Faltantes</div>
      <div class="sync loading" id="sm">Conectando...</div>
    </div>
    <div class="xbar">
      <button class="btn btn-sec" id="btnReload">Actualizar</button>
      <button class="btn btn-csv" id="btnCSV">CSV</button>
      <button class="btn btn-wa" id="btnWAAll">WA General</button>
    </div>
  </div>

  <div class="err-box" id="errBox"></div>

  <div id="panelWAAll" class="panel">
    <div class="panel-title">Resumen general</div>
    <div class="prev" id="prevAll"></div>
    <div class="warow">
      <input type="text" id="numAll" placeholder="+54 9 11 1234-5678" style="flex:1;min-width:150px" />
      <button class="btn btn-wa" id="btnEnvAll">Enviar WA</button>
      <button class="btn btn-sec" id="btnCopyAll">Copiar</button>
      <button class="btn btn-sec" id="btnCerAll">Cerrar</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size:14px;font-weight:bold;color:#B85C38;margin-bottom:12px">Nuevo registro</div>
    <div class="g3">
      <div><label class="lbl">Sucursal *</label>
        <select id="fSuc">
          <option value="">Seleccionar...</option>
          <option value="mig">Migueletes</option>
          <option value="sir">Rep. Arabe Siria</option>
          <option value="cas">Castex</option>
        </select>
      </div>
      <div><label class="lbl">Proveedor *</label><input type="text" id="fProv" placeholder="Nombre del proveedor" /></div>
      <div><label class="lbl">Producto *</label><input type="text" id="fProd" placeholder="Nombre del producto" /></div>
    </div>
    <div class="g3">
      <div><label class="lbl">Motivo *</label>
        <select id="fMot">
          <option value="">Seleccionar...</option>
          <option value="dev">Devolucion</option>
          <option value="falt">Faltante de pedido</option>
          <option value="venc">Producto vencido</option>
          <option value="dan">Producto danado</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div><label class="lbl">N de factura</label><input type="text" id="fFact" placeholder="0001-00012345" /></div>
      <div><label class="lbl">Cantidad</label><input type="number" id="fCant" min="1" placeholder="1" /></div>
    </div>
    <div class="g3">
      <div><label class="lbl">Fecha vencimiento</label><input type="date" id="fVto" /></div>
      <div><label class="lbl">Fecha reclamo</label><input type="date" id="fFecRec" /></div>
      <div><label class="lbl">Codigo devolucion</label><input type="text" id="fCod" placeholder="DEV-2026-001" /></div>
      <div>
        <label class="lbl">Foto</label>
        <label class="foto-lbl" for="fFoto">+ Adjuntar foto</label>
        <input type="file" id="fFoto" accept="image/*" style="display:none" />
        <div id="fotoNom" style="font-size:11px;color:#888;margin-top:4px"></div>
      </div>
    </div>
    <div style="margin-bottom:10px"><label class="lbl">Observaciones</label><textarea id="fObs" placeholder="Detalles adicionales..."></textarea></div>
    <button class="btn-add" id="btnAdd">+ Agregar registro</button>
  </div>

  <div class="filtros" id="filtros">
    <button class="fbtn on" data-fil="todos">Todos</button>
    <button class="fbtn" data-fil="mig">Migueletes</button>
    <button class="fbtn" data-fil="sir">Siria</button>
    <button class="fbtn" data-fil="cas">Castex</button>
    <button class="fbtn" data-fil="pend">Solo pendientes</button>
  </div>

  <div class="contador" id="contador"></div>

  <div class="twrap">
    <table>
      <thead><tr>
        <th>Sucursal</th><th>Proveedor</th><th>Producto</th><th>Motivo</th>
        <th>Cant</th><th>Factura</th><th>Vto</th><th>F. Reclamo</th><th>Cod dev</th>
        <th>Foto</th><th>Observaciones</th><th>Reclamo</th><th>Listo</th><th></th><th>WA</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyMsg" class="empty">Sin registros</div>
  </div>

  <div id="panelRow" class="panel" style="margin-top:10px">
    <div class="panel-title" id="rowTit">Mensaje al proveedor</div>
    <div class="prev" id="prevRow"></div>
    <div class="warow">
      <input type="text" id="numRow" placeholder="+54 9 11 1234-5678" style="flex:1;min-width:150px" />
      <button class="btn btn-wa" id="btnEnvRow">Enviar WA</button>
      <button class="btn btn-sec" id="btnCopyRow">Copiar</button>
      <button class="btn btn-sec" id="btnCerRow">Cerrar</button>
    </div>
  </div>
</div>

<script>
// datos via proxy /api/devoluciones

var curFil = 'todos';
var fotoData = null, fotoStr = '';
var fotoSubiendo = false;
var registros = [];
var provNums = {};
var isSaving = false;
var reloadTimer = null;

var SL = {mig:'Migueletes', sir:'Rep. Arabe Siria', cas:'Castex'};
var SC = {mig:'suc-mig', sir:'suc-sir', cas:'suc-cas'};
var ML = {dev:'Devolucion', falt:'Faltante pedido', venc:'Vencido', dan:'Danado', otro:'Otro'};
var MC = {dev:'bd', falt:'bf', venc:'bd', dan:'bd', otro:'bo'};

function setSync(msg, cls) {
  var el = document.getElementById('sm');
  el.textContent = msg;
  el.className = 'sync ' + (cls||'');
}
function showErr(msg) {
  var el = document.getElementById('errBox');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setBtnAdd(on) {
  var b = document.getElementById('btnAdd');
  b.disabled = !on;
  b.textContent = on ? '+ Agregar registro' : 'Guardando...';
}

// Modal foto
document.getElementById('fotoModalClose').addEventListener('click', function() {
  document.getElementById('fotoModal').classList.remove('open');
});
document.getElementById('fotoModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

function abrirFoto(url) {
  document.getElementById('fotoModalImg').src = url;
  document.getElementById('fotoModal').classList.add('open');
}

// Carga datos
async function loadData() {
  if (isSaving) return;
  setSync('Actualizando...', 'loading');
  try {
    var resp = await fetch('/api/devoluciones');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    registros = data.registros || [];
    provNums = data.provNums || {};
    setSync('Actualizado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}), 'ok');
    showErr('');
  } catch(e) {
    setSync('Error al conectar', 'err');
    showErr('No se pudo conectar. Error: ' + e.message);
  }
  render();
}

async function saveData() {
  isSaving = true;
  setBtnAdd(false);
  setSync('Guardando...', 'loading');
  try {
    var toSave = {
      registros: registros.map(function(r) {
        var c = {};
        for (var k in r) c[k] = r[k];
        // Si foto es base64 (empieza con data:), no la guardamos (demasiado grande)
        if (c.foto && c.foto.indexOf('data:') === 0) delete c.foto;
        return c;
      }),
      provNums: provNums
    };
    var resp = await fetch('/api/devoluciones', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toSave)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    setSync('Guardado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}), 'ok');
    showErr('');
  } catch(e) {
    setSync('Error al guardar', 'err');
    showErr('Error al guardar: ' + e.message);
  }
  isSaving = false;
  setBtnAdd(true);
}

function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(function() { if (!isSaving) loadData(); }, 30000);
}

// Foto upload
document.getElementById('fFoto').addEventListener('change', function() {
  var file = this.files[0];
  if (!file) return;
  fotoStr = file.name;
  fotoData = null;
  fotoSubiendo = true;
  document.getElementById('fotoNom').textContent = 'Subiendo foto...';

  var fr = new FileReader();
  fr.onload = function(e) {
    var base64 = e.target.result;
    fetch('/api/cloudinary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: base64 })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      fotoSubiendo = false;
      if (d.secure_url) {
        fotoData = d.secure_url;
        document.getElementById('fotoNom').textContent = 'Foto lista';
      } else {
        document.getElementById('fotoNom').textContent = 'Error al subir foto';
      }
    })
    .catch(function() {
      fotoSubiendo = false;
      document.getElementById('fotoNom').textContent = 'Error al subir foto';
    });
  };
  fr.readAsDataURL(file);
});

// Agregar registro
document.getElementById('btnAdd').addEventListener('click', async function() {
  if (fotoSubiendo) { alert('Esperando que termine de subir la foto...'); return; }
  var suc = document.getElementById('fSuc').value;
  var pv = document.getElementById('fProv').value.trim();
  var pd = document.getElementById('fProd').value.trim();
  var mt = document.getElementById('fMot').value;
  if (!suc || !pv || !pd || !mt) { alert('Completa sucursal, proveedor, producto y motivo.'); return; }

  registros.push({
    id: Date.now(), sucursal: suc, proveedor: pv, producto: pd, motivo: mt,
    cantidad: document.getElementById('fCant').value || '1',
    factura: document.getElementById('fFact').value.trim(),
    vto: document.getElementById('fVto').value,
    codigo: document.getElementById('fCod').value.trim(),
    obs: document.getElementById('fObs').value.trim(),
    foto: fotoData || null,
    fotoNombre: fotoStr,
    reclamoEnviado: false,
    realizado: false,
    fechaReclamo: document.getElementById('fFecRec').value,
    fecha: new Date().toLocaleDateString('es-AR')
  });

  render();

  document.getElementById('fSuc').value = '';
  document.getElementById('fMot').value = '';
  ['fProv','fProd','fFact','fCant','fCod','fObs'].forEach(function(i) { document.getElementById(i).value = ''; });
  document.getElementById('fVto').value = '';
  document.getElementById('fFecRec').value = '';
  document.getElementById('fFoto').value = '';
  document.getElementById('fotoNom').textContent = '';
  fotoData = null; fotoStr = ''; fotoSubiendo = false;

  await saveData();
  scheduleReload();
});

// Filtros
document.getElementById('filtros').addEventListener('click', function(e) {
  var btn = e.target.closest('.fbtn');
  if (!btn) return;
  curFil = btn.getAttribute('data-fil');
  document.querySelectorAll('.fbtn').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  render();
});

// Tabla - checkbox
document.getElementById('tbody').addEventListener('change', async function(e) {
  if (e.target.type !== 'checkbox') return;
  var id = +e.target.getAttribute('data-id');
  var tipo = e.target.getAttribute('data-tipo');
  for (var i = 0; i < registros.length; i++) {
    if (registros[i].id === id) {
      if (tipo === 'reclamo') registros[i].reclamoEnviado = !registros[i].reclamoEnviado;
      else registros[i].realizado = !registros[i].realizado;
      break;
    }
  }
  render();
  await saveData();
  scheduleReload();
});

// Tabla - click
document.getElementById('tbody').addEventListener('click', async function(e) {
  // Foto
  if (e.target.classList.contains('fp')) {
    var url = e.target.getAttribute('data-url');
    if (url) abrirFoto(url);
    return;
  }
  // Eliminar
  var del = e.target.closest('.bdel');
  if (del) {
    var id = +del.getAttribute('data-id');
    registros = registros.filter(function(r) { return r.id !== id; });
    render();
    await saveData();
    scheduleReload();
    return;
  }
  // WA individual
  var wa = e.target.closest('.bwarow');
  if (wa) {
    var id = +wa.getAttribute('data-id');
    var rec = null;
    for (var i = 0; i < registros.length; i++) { if (registros[i].id === id) { rec = registros[i]; break; } }
    if (rec) abrirWAItem(rec);
  }
});

function getFiltered() {
  return registros.filter(function(r) {
    if (curFil === 'todos') return true;
    if (curFil === 'pend') return !r.realizado;
    return r.sucursal === curFil;
  });
}

function render() {
  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('emptyMsg');
  var cont = document.getElementById('contador');
  var rows = getFiltered();
  var pend = rows.filter(function(r) { return !r.realizado; }).length;
  cont.textContent = rows.length + ' registro' + (rows.length !== 1 ? 's' : '') + ' - ' + pend + ' pendiente' + (pend !== 1 ? 's' : '');
  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var vto = r.vto ? r.vto.split('-').reverse().join('/') : '--';
    var fecRec = r.fechaReclamo ? r.fechaReclamo.split('-').reverse().join('/') : '--';
    var fotoCell = r.foto
      ? '<img src="' + r.foto + '" class="fp" data-url="' + r.foto + '" alt="foto" title="Ver foto" />'
      : '--';
    var recBg = r.reclamoEnviado ? 'background:#E6F1FB' : '';
    html += '<tr class="' + (r.realizado ? 'done' : '') + '">'
      + '<td><span class="' + (SC[r.sucursal]||'bo') + '">' + (SL[r.sucursal]||r.sucursal) + '</span></td>'
      + '<td>' + esc(r.proveedor) + '</td>'
      + '<td>' + esc(r.producto) + '</td>'
      + '<td><span class="' + (MC[r.motivo]||'bo') + '">' + (ML[r.motivo]||r.motivo) + '</span></td>'
      + '<td style="text-align:center">' + r.cantidad + '</td>'
      + '<td style="font-size:11px">' + esc(r.factura||'--') + '</td>'
      + '<td style="font-size:11px">' + vto + '</td>'
      + '<td style="font-size:11px">' + fecRec + '</td>'
      + '<td style="font-size:11px">' + esc(r.codigo||'--') + '</td>'
      + '<td style="text-align:center">' + fotoCell + '</td>'
      + '<td style="font-size:11px;color:#666">' + esc(r.obs||'--') + '</td>'
      + '<td style="text-align:center;' + recBg + '"><input type="checkbox" class="chk" data-tipo="reclamo" data-id="' + r.id + '" ' + (r.reclamoEnviado ? 'checked' : '') + ' title="Reclamo enviado"></td>'
      + '<td style="text-align:center"><input type="checkbox" class="chk" data-tipo="listo" data-id="' + r.id + '" ' + (r.realizado ? 'checked' : '') + ' title="Listo"></td>'
      + '<td style="text-align:center"><button class="bdel" data-id="' + r.id + '">X</button></td>'
      + '<td style="text-align:center"><button class="bwarow" data-id="' + r.id + '">WA</button></td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

function abrirWAItem(r) {
  var fecha = new Date().toLocaleDateString('es-AR');
  var msg = 'Casa NOA - ' + ML[r.motivo] + '\n' + fecha + '\n\n'
    + 'Proveedor: ' + r.proveedor + '\nProducto: ' + r.producto
    + '\nCantidad: ' + r.cantidad + '\nSucursal: ' + (SL[r.sucursal]||r.sucursal);
  if (r.factura) msg += '\nFactura: ' + r.factura;
  if (r.vto) msg += '\nVto: ' + r.vto.split('-').reverse().join('/');
  if (r.codigo) msg += '\nCod dev: ' + r.codigo;
  if (r.obs) msg += '\nObs: ' + r.obs;
  if (r.foto) msg += '\nFoto: ' + r.foto;
  msg += '\n\nCasa NOA';
  document.getElementById('prevRow').textContent = msg;
  document.getElementById('rowTit').textContent = 'Mensaje para: ' + r.proveedor;
  document.getElementById('numRow').value = provNums[r.proveedor.toLowerCase()] || '';
  document.getElementById('panelRow').classList.add('open');
  window.scrollTo({top: document.getElementById('panelRow').offsetTop - 20, behavior: 'smooth'});
}

// WA General
document.getElementById('btnWAAll').addEventListener('click', function() {
  var p = document.getElementById('panelWAAll');
  if (p.classList.contains('open')) { p.classList.remove('open'); return; }
  p.classList.add('open');
  var fecha = new Date().toLocaleDateString('es-AR');
  var lines = ['Casa NOA - Devoluciones y Faltantes', fecha, ''];
  var keys = ['mig','sir','cas'];
  for (var k = 0; k < keys.length; k++) {
    var s = keys[k];
    var rows = registros.filter(function(r) { return r.sucursal === s && !r.realizado; });
    if (!rows.length) continue;
    lines.push('--- ' + SL[s] + ' ---');
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      lines.push((i+1) + '. ' + r.proveedor + ' - ' + r.producto + ' (' + ML[r.motivo] + ', cant: ' + r.cantidad + ')');
      if (r.factura) lines.push('   Factura: ' + r.factura);
      if (r.foto) lines.push('   Foto: ' + r.foto);
    }
    lines.push('');
  }
  document.getElementById('prevAll').textContent = lines.join('\n');
});
document.getElementById('btnCerAll').addEventListener('click', function() { document.getElementById('panelWAAll').classList.remove('open'); });
document.getElementById('btnEnvAll').addEventListener('click', function() {
  var txt = document.getElementById('prevAll').textContent;
  var num = document.getElementById('numAll').value.replace(/[^0-9]/g,'');
  window.open((num ? 'https://wa.me/'+num : 'https://wa.me/') + '?text=' + encodeURIComponent(txt), '_blank');
});
document.getElementById('btnCopyAll').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('prevAll').textContent).then(function() { alert('Copiado.'); });
});
document.getElementById('btnEnvRow').addEventListener('click', function() {
  var txt = document.getElementById('prevRow').textContent;
  var num = document.getElementById('numRow').value.replace(/[^0-9]/g,'');
  window.open((num ? 'https://wa.me/'+num : 'https://wa.me/') + '?text=' + encodeURIComponent(txt), '_blank');
});
document.getElementById('btnCopyRow').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('prevRow').textContent).then(function() { alert('Copiado.'); });
});
document.getElementById('btnCerRow').addEventListener('click', function() { document.getElementById('panelRow').classList.remove('open'); });
document.getElementById('btnReload').addEventListener('click', function() { loadData(); });

document.getElementById('btnCSV').addEventListener('click', function() {
  var lines = ['Sucursal,Proveedor,Producto,Motivo,Cantidad,Factura,Fecha vto,Cod devolucion,Observaciones,Realizado,Fecha'];
  for (var i = 0; i < registros.length; i++) {
    var r = registros[i];
    lines.push([(SL[r.sucursal]||r.sucursal), r.proveedor, r.producto, (ML[r.motivo]||r.motivo),
      r.cantidad, (r.factura||''), (r.vto||''), (r.codigo||''),
      '"' + ((r.obs||'').replace(/"/g,'""')) + '"',
      (r.realizado ? 'Si' : 'No'), r.fecha].join(','));
  }
  var blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'CasaNOA_Devoluciones.csv'; a.click();
});

loadData();
scheduleReload();
</script>
</body>
</html>
